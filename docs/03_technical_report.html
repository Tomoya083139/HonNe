## 1. アプリの概要

**本音** は、恋人や友達と「ちゃんと話す時間」をつくるための質問カードアプリです。スマホのブラウザで開いてすぐ遊べる Web アプリ（PWA）で、ログインもサーバーも不要です。

### できること

| 機能 | 内容 |
|---|---|
| 2 つのモード | **恋人モード**（2 人・名前を交互に指名）／ **友達モード**（2〜8 人・ランダム指名） |
| 12 デッキ・775 問 | 恋人 6 デッキ（恋人と／はじめての2人／将来のこと／記念日に／遠距離で／すれ違ったあとに）、友達 6 デッキ（友達と／飲み会で／恋バナ／はじめまして／旅行・ドライブで／深夜の本音） |
| 8 つの質問形式 | 質問／どっち派？／当てっこ／せーの／10点満点／ありがとう／お願い・約束／ミッション（タイマー付き） |
| 4 段階の深さ | Lv.1 ライト → Lv.2 ミディアム → Lv.3 ディープ → Lv.4 本音。セッション内で自動的に深まる |
| 出題のカスタマイズ | テーマ・深さ・枚数（5/10/20/30/無制限）・段階モードの ON/OFF |
| 記録 | お気に入り、メモ、ウィジェットの答え（誰がどう答えたか）、セッション履歴 |
| 日英併記 | すべての質問に英語訳。設定で非表示にできる |
| 16+ フィルタ | 親密さに踏み込むカードは設定で ON にしたときだけ出題 |

### 設計の前提

- **「その場で遊ぶ」が主目的**。通知・同期・アカウントなどの「あとで使う」機能は意図的に持たない。
- **1 台のスマホを回して使う**。したがって入力は最小限、タップ中心、縦持ち前提。
- **データは端末内だけ**。プライバシー面の説明が簡単で、バックエンド運用も不要。

## 2. 技術スタック

すべて実際にインストールされているバージョン（`package-lock.json` より）。

| 分類 | 技術 | バージョン | 役割 |
|---|---|---|---|
| 言語 | TypeScript | 6.0.3 | 型付き JavaScript。`strict` 設定 |
| UI ライブラリ | React | 19.3.0 | コンポーネント描画 |
| ルーティング | react-router-dom | 7.18.3 | 画面遷移（`HashRouter`） |
| アニメーション | framer-motion | 13.2.0 | カードのドラッグ・スワイプ・退場アニメーション |
| 状態管理 | zustand | 5.0.15 | グローバル状態 + `persist` ミドルウェアで localStorage 保存 |
| ビルド | Vite | 8.3.0 | 開発サーバー（HMR）と本番バンドル（内部は Rolldown） |
| React プラグイン | @vitejs/plugin-react | 6.1.1 | JSX 変換と Fast Refresh |
| PWA | vite-plugin-pwa（Workbox 7.4.1） | 1.3.0 | manifest 生成と Service Worker によるオフライン対応 |
| Lint | oxlint | 1.82.0 | 高速リンター（React Hooks ルール含む） |
| 実行環境 | Node.js | 24.x | ビルド・検証スクリプトの実行 |
| ホスティング | Netlify | — | 静的配信。`netlify.toml` でビルド設定 |

### なぜこの組み合わせか

- **React + TypeScript + Vite** は最も情報が多く、後から人が加わっても読める標準構成。
- **framer-motion** は「指で引っ張って離す」「閾値を超えたら飛んでいく」といったカード操作を、物理演算込みで数行で書ける。
- **zustand** は Redux より圧倒的に少ないコード量で、`persist` を付けるだけで localStorage 保存が完成する。
- **HashRouter** を選んだのは、どの静的ホスティングでも `index.html` 1 枚で動くから（`/#/home` のように URL に `#` が付く）。
- **CSS はプレーンな 1 ファイル**（Tailwind 等なし）。デザイン変数を `:root` に集約し、ダークモードも `prefers-color-scheme` で切り替えるだけの構成にして、依存を減らした。

### 依存関係の全体量

本番バンドルは **JS 577 KB（gzip 後 176 KB）＋ CSS 10 KB**。775 問の質問データ（JSON）を JS に同梱しているため、初回ロード後はネットワークなしで全機能が動きます。

## 3. 全体アーキテクチャ

サーバーを持たない **完全クライアントサイド SPA** です。

```
┌──────────────────────── ブラウザ ────────────────────────┐
│                                                          │
│  index.html ──▶ main.tsx ──▶ <App/> (HashRouter)         │
│                                  │                       │
│        ┌─────────────┬───────────┼───────────┬────────┐  │
│        ▼             ▼           ▼           ▼        ▼  │
│   Onboarding       Home      DeckSetup    Session   Summary / Library / Settings
│        │             │           │           │                │
│        └─────────────┴───────────┴─────┬─────┴────────────────┘
│                                        ▼
│                        zustand store (useStore)  ◀──▶  localStorage["honne-v1"]
│                                        ▲
│                         content/ (DECKS: 12 デッキ・775 問、ビルド時に同梱)
│                                        ▲
│                    session/build.ts（出題キュー）・session/people.ts（指名）
│                                                          │
│  Service Worker (Workbox) ── アプリ一式をキャッシュ → オフラインでも起動  │
└──────────────────────────────────────────────────────────┘
```

### レイヤーの分け方

| レイヤー | 場所 | 依存の向き |
|---|---|---|
| **コンテンツ** | `src/content/` | 何にも依存しない純データ + 検索関数 |
| **ドメインロジック** | `src/session/` | 型とコンテンツにだけ依存。React に依存しない純関数（テストしやすい） |
| **状態** | `src/store.ts` | zustand。UI から呼ばれる |
| **UI** | `src/pages/`, `src/components/` | 上記すべてを使う |

「ロジックは React から切り離す」を徹底しているので、出題アルゴリズムや指名ロジックは Node.js 単体で実行・検証できます（第 17 章参照）。

## 5. データモデル

すべて `src/types.ts` に定義。

### Card（1 枚の質問）

```ts
interface Card {
  id: string            // "couple_basic_012" — <deckId>_<3桁連番>
  type: CardType        // 'open' | 'choice' | 'guess' | 'reveal' | 'scale' | 'thanks' | 'wish' | 'action'
  level: 1 | 2 | 3 | 4  // 深さ
  themes: string[]      // デッキの themes に含まれるキー（例: ['love', 'daily']）
  text: { ja: string; en: string }
  options?: { ja: string; en: string }[]  // choice のみ（2〜4 択）
  seconds?: number                        // action のみ（タイマー秒数）
  rating?: 'all' | '16+'                  // 16+ は設定 ON のときだけ出題
}
```

### Deck（デッキ）

```ts
interface Deck {
  id: string; mode: 'couple' | 'friends'
  name: LText; tagline: LText
  color: string        // デッキのテーマカラー（CSS 変数 --deck に流し込む）
  themes: string[]     // このデッキで使えるテーマキー
  cards: Card[]
}
```

### SessionConfig（出題条件）

`DeckSetup` で作られ、`Session` に `location.state` として渡されます。

```ts
interface SessionConfig {
  deckId: string
  themes: string[]     // 空 = すべて
  levels: Level[]      // 出題する深さ
  count: number        // 0 = 無制限
  gradient: boolean    // true: ライト→本音の順に並べる
}
```

### 保存される記録

```ts
interface AnswerRecord {   // ウィジェットの答え・メモ
  cardId: string; deckId: string; at: string  // ISO 日時
  memo?: string
  values?: string[]        // "とも: 顔" のように名前付き
  result?: 'hit' | 'miss'  // 当てっこの結果
}

interface SessionRecord {  // 1 回のセッション
  id: string; deckId: string; mode: Mode
  startedAt: string; endedAt?: string
  answered: number; passed: number; hits: number; misses: number
}
```

### 型の関係

```
Deck 1 ──▶ * Card
SessionConfig ──(deckId)──▶ Deck
AnswerRecord ──(cardId)──▶ Card
SessionRecord ──(deckId)──▶ Deck
Profile { mode, names[2], friends[], showEnglish, adult, onboarded }
```

## 6. コンテンツ（質問データ）の仕組み

### ファイル形式

1 デッキ = 1 JSON ファイル。ヘッダーの下に「1 カード 1 行」で並べ、差分レビューしやすくしています。

```jsonc
{
  "id": "friends_party",
  "mode": "friends",
  "name": {"ja":"飲み会で","en":"Night Out"},
  "tagline": {"ja":"盛り上がる。でもちょっと本音も出る。","en":"..."},
  "color": "#F2A33A",
  "themes": ["fun","icebreak","romance","daily","past","feelings"],
  "cards": [
    {"id":"friends_party_001","type":"open","level":1,"themes":["fun"],"text":{"ja":"...","en":"..."}},
    {"id":"friends_party_002","type":"choice","level":1,"themes":["fun"],"text":{...},"options":[{"ja":"..","en":".."},...]},
    ...
  ]
}
```

### 読み込み方法

`src/content/index.ts` が Vite の `import.meta.glob` で `decks/*/*.json` を **ビルド時に** 一括取り込みします。ファイルを追加するだけでデッキが増え、登録作業は不要です。

```ts
const modules = import.meta.glob<Deck>('./decks/*/*.json', { eager: true, import: 'default' })
export const DECKS = Object.keys(modules).sort().map((k) => modules[k])   // ファイル名順
```

ファイル名の先頭 2 桁（`01_`, `02_`…）が Home での表示順になります。

### 品質を守る仕組み — `npm run validate`

`scripts/validate-content.mjs` が以下を検査し、1 件でも問題があれば終了コード 1 で失敗します。

- ID の重複／`<deckId>_` で始まっているか
- `type` が 8 種のいずれか、`level` が 1〜4
- 日本語・英語テキストの欠落
- **質問文（ja）の重複**（デッキをまたいでも検出）
- カードの `themes` がデッキの `themes` に宣言されているか
- `choice` は選択肢 2 つ以上、`action` は `seconds` 必須
- フォルダ名（couple/friends）と `mode` の一致

| 恋人 | 枚数 | 友達 | 枚数 |
|---|---|---|---|
| 恋人と | 92 | 友達と | 85 |
| はじめての2人 | 71 | 飲み会で | 70 |
| 将来のこと | 65 | 恋バナ | 63 |
| 記念日に | 55 | はじめまして | 60 |
| 遠距離で | 55 | 旅行・ドライブで | 56 |

各デッキは Lv.1 が最も多く Lv.4 が最も少ないピラミッド型で、形式は `open` が約 7 割、残りを他 7 形式に振り分けています。

| `/home` | Home | モード切替（恋人／友達）、デッキ一覧、進捗（既出/総数） |
| `/deck/:id` | DeckSetup | テーマ・深さ・枚数・段階モードの選択、既出リセット |

## 8. セッションの流れ

`src/pages/Session.tsx` が中心。1 セッションのライフサイクルは次の通りです。

```
DeckSetup「はじめる」
   │  nav('/session', { state: cfg })
   ▼
Session マウント
   ├─ seenAtStart = 既出 ID の snapshot（セッション中に増えても再計算しない）
   ├─ queue  = buildQueue(deck, cfg, seenAtStart, adult)   … useMemo（deck.id が変わらない限り固定）
   ├─ people = participants(mode, names, friends)           … 参加者名
   ├─ turns  = assignTurns(mode, people, queue)             … カードごとの指名を先に確定
   └─ startSession({ id: Date.now(), ... })                 … 履歴に仮登録（冪等）
   │
   ▼  カードごとのループ
   ├─ 表示: queue[idx]（前面）と queue[idx+1]（背面・操作不可）
   ├─ ユーザー操作: ウィジェット入力 → draft（memo / values / result）に一時保存
   ├─ 右スワイプ or「次のカード」→ advance('next')
   │     ├─ markSeen(deck, card)
   │     ├─ stats.answered++（当てっこなら hits / misses も）
   │     └─ draft に何か入っていれば saveAnswer({ cardId, at, memo, values: "名前: 値", result })
   ├─ 左スワイプ or「パス」→ advance('pass')
   │     ├─ markSeen
   │     └─ stats.passed++（答えは保存しない）
   └─ idx+1 >= queue.length なら finish()
   │
   ▼
finish()  … updateSession({ endedAt, ...stats }) → nav('/summary', { state: { sessionId } })

（✕ ボタン・ブラウザバックなどで途中離脱した場合）
   └─ アンマウント時に closeIfAbandoned() が同じ内容を記録する
```

### 集計を `useRef` にしている理由

`stats` はカードごとに書き換わりますが、その値で画面を再描画する必要はありません。`useState` にすると毎回カード全体が再レンダリングされ、アニメーション中にちらつく可能性があるため、`useRef` に溜めて終了時にまとめて保存しています。

### 「既出」の扱い

- `seen[deckId]` は「一度でも画面に出したカード ID」のリスト。パスしても既出扱い。
- セッション開始時のスナップショットを使うので、同じセッション内で同じカードが二度出ることはありません。
- DeckSetup の「既出をリセット」で空にできます。

## 9. 出題アルゴリズム

`src/session/build.ts` の `buildQueue`。React に依存しない純関数です。

### 手順

```
1. pool  = deck.cards を条件でフィルタ
           ・level が cfg.levels に含まれる
           ・cfg.themes が空、または themes が 1 つでも一致
           ・adult=false なら rating '16+' を除外
2. fresh = pool のうち未出題（seen に含まれない）
3. target = cfg.count（0 なら pool.length）

4a. gradient = true（既定）
      picked = pickByLevel(shuffle(fresh), levels, target)       ← まず未出題だけで
      足りなければ picked += pickByLevel(shuffle(既出), levels, 残り)
      picked を level 昇順に安定ソート                            ← ライト → 本音 の勾配
4b. gradient = false
      picked = shuffle(fresh) → 足りなければ shuffle(既出) を後ろに → target で切る
```

### `pickByLevel` — レベル均等配分

```
quota = ceil(target / levels.length)      例: 10 枚・4 レベル → 3 枚ずつ
各レベルから quota 枚まで取り、余りは leftovers へ
picked が target に届かなければ leftovers から補充（あるレベルが薄いときの救済）
```

こうすると「10 枚」なら Lv.1〜4 がだいたい 3:3:2:2 のように並び、会話が自然に深まっていきます。

### 修正済みの不具合（監査で発見）

以前は「レベルごとの枠」を**未出題と既出を混ぜたリスト**から埋めていたため、あるレベルの未出題が少ないと、他のレベルに未出題が残っていても既出が選ばれることがありました。現在は「未出題を全体で使い切ってから既出」に変更しています（第 17 章のテストケース「prefers unseen」）。

### `countAvailable`

DeckSetup の「条件に合うカード N 枚（うち既出 M 枚）」表示用。`buildQueue` と同じフィルタを通した母集団で数えます。

## 10. 指名（ターン）ロジック

`src/session/people.ts`。

### `participants(mode, names, friends)` — 誰が参加しているか

| モード | 結果 |
|---|---|
| couple | `[names[0] or 'あなた', names[1] or '相手']` |
| friends（名前 2 人以上） | 空欄を除いた名前。**同名は `A`, `A2`, `A3` と番号付け**（指名・集計の混同防止） |
| friends（名前 1 人以下） | `['あなた', '相手']` にフォールバックし、ターン表示は「時計回りで順番に答えよう」 |

### `assignTurns(mode, people, queue)` — カードごとの指名

セッション開始時に全カード分を先に決めます（表示のたびに乱数を引くと、再レンダリングで指名が変わってしまうため）。

```
for 各カード i:
  first  = couple なら i % 2（交互）
           friends なら「直前と違う人」からランダム
  second = first 以外からランダム（ありがとう / お願い の相手）
```

### 画面上の見せ方（Session の `turnLine`）

| 形式 | 恋人 | 友達（名前あり） |
|---|---|---|
| 通常 | **とも** が最初に答える番 | **けん** から時計回りに |
| 当てっこ | **みお** が **とも** の答えを予想 | **とも** の答えをみんなで予想 |
| ありがとう／お願い | **とも** → **みお** へ | **みお** → **さくら** へ |

## 11. カード UI とスワイプ

`src/components/QuestionCard.tsx`。

### 構造

```
<motion.div class="card" drag="x" style={{ x, rotate }}>
  <div class="wave">   ♡お気に入り   Lv バッジ   波形 SVG   </div>
  <div class="body">   形式バッジ / 質問 / 英訳 / [interact: ウィジェット + メモ] / ロゴ </div>
</motion.div>
```

前面カードと背面カード（次のカード）を同じコンポーネントで描画し、背面は `back` プロップで `scale: .95, y: 12`・操作不可にしています。`key={card.id}` なので、カードが進むと背面の要素がそのまま前面に昇格し、`initial → animate` で自然に大きくなります。

### スワイプの判定

```ts
onDragEnd: (_, info) => {
  if (info.offset.x > 110 || info.velocity.x > 600)  swipe('next')   // 右 → 次へ
  else if (info.offset.x < -110 || info.velocity.x < -600) swipe('pass')  // 左 → パス
  else animate(x, 0, spring)                                            // 戻す
}
```

`x` は framer-motion の `MotionValue`。`rotate` は `useTransform(x, [-250, 250], [-12, 12])` で、引っ張るほど傾きます。

### 退場アニメーションの設計

```ts
const swipe = (dir) => {
  if (leaving) return            // 二重発火防止
  setLeaving(true)
  animate(x, dir === 'next' ? 600 : -600, { duration: 0.22 })
  window.setTimeout(() => p.onSwipe(dir), 230)   // Promise ではなく時間で確定
}
```

当初は `animate(...).then(...)` に頼っていましたが、`dragConstraints` がプログラム側のアニメーションを止めて Promise が解決しないケースがあり、**カードが進まなくなる**バグが出ました。現在は制約を外し、時間ベースで確実に次へ進めています。

### ウィジェット領域とドラッグの分離

スライダーやテキスト入力を横に動かすとカードごとスワイプされてしまうため、ウィジェットとメモを包む `.interact` で `onPointerDownCapture={e => e.stopPropagation()}` し、framer-motion にポインタイベントを渡しません。CSS でも `input[type=range] { touch-action: none }` を指定しています。

### 本文のスクロール

4 人分のスライダーやメモを開くとカードの高さを超えるため、`.body` は `overflow-y: auto`。「スクロールできることが分からない」問題には、`background-attachment: local` を使った **スクロール影**（上下端に薄い影が出て、端に達すると消える）で対処しています。JS 不要の CSS だけの手法です。

## 12. 質問形式ウィジェット

`src/components/Widgets.tsx`。すべて `WidgetProps { card, people, turn, showEnglish, onValues, onResult }` を受け取ります。

| 形式 | コンポーネント | 動き | 保存されるもの |
|---|---|---|---|
| どっち派？ `choice` | `ChoiceWidget` | 参加者チップを選び→選択肢をタップ。未回答の人へ自動で移る。全員回答で判定表示：2 人なら「一致！／違う派！」、3 人以上なら「多数派は「X」(3人)。少数派の A に理由を聞こう」 | `values`（人ごとの選択） |
| せーの `reveal` | `RevealWidget` → `RevealInputs` | 人数分の入力欄をぼかして表示 → 「せーの！で公開」で一斉に見せる。全員一致なら祝福 | `values` |
| せーので指さし `reveal`（文中に「指さし」） | `PointWidget` | 入力は出さず、3・2・1・「せーの！」のカウントダウンだけ | なし |
| 10点満点 `scale` | `ScaleWidget` | 人数分のスライダー。差 1 以内で「ほぼ同じ感覚」、それ以上は最高／最低の人と点差 | `values` |
| 当てっこ `guess` | `GuessWidget` | 「A が B の答えを予想 → B が発表」の案内と ⭕／❌。3 人以上は「誰か当てた／全員はずれ」 | `result` |
| ミッション `action` | `ActionWidget` | `seconds` のカウントダウンタイマー。スタート／一時停止／リセット | なし |
| ありがとう `thanks`／お願い `wish`／質問 `open` | — | ウィジェットなし。ターン表示で相手を指名 | メモのみ |
| （共通）メモ | `MemoWidget` | 「メモを残す」で textarea を開く | `memo` |

各ウィジェットは自分のローカル state で入力を持ち、変化のたびに `onValues` / `onResult` で親（Session の `draft`）へ通知します。カードが進むと `key` が変わって state ごと捨てられるため、前のカードの入力が残ることはありません。

## 13. 状態管理と永続化

`src/store.ts`。zustand の `create` + `persist`。

### ストアの形

```ts
{
  profile: { onboarded, mode, names: [a, b], friends: string[], showEnglish, adult },
  seen:      { [deckId]: cardId[] },   // 既出
  favorites: cardId[],
  answers:   AnswerRecord[],
  sessions:  SessionRecord[],
  // actions
  setProfile, markSeen, resetSeen, toggleFavorite, saveAnswer,
  startSession, updateSession, clearAll
}
```

### 永続化

- キーは `localStorage["honne-v1"]`。すべての `set()` 後に自動で JSON 保存。
- **後方互換**: `merge` オプションで `profile` を `{ ...初期値, ...保存値 }` とマージ。古いデータに `friends` が無くても壊れません（監査で実機確認済み）。
- **冪等性**: `startSession` は同じ ID が既にあれば追加しない（React StrictMode の二重実行対策）。`markSeen` も重複を追加しない。

### コンポーネントからの読み方

```ts
const favorites = useStore((s) => s.favorites)          // 必要な部分だけ購読
const seen = useStore((s) => s.seen[id]) ?? EMPTY       // 未定義時は「同じ参照の空配列」
```

セレクタが毎回新しい配列を返すと React が無限再レンダリングになる（`getSnapshot should be cached` エラー）ため、フォールバックはモジュールスコープの定数 `EMPTY` を使っています。開発中に実際にこの無限ループが起きて修正した箇所です。

### データ削除

Settings の「すべてのデータを削除」は `clearAll()` で初期状態に戻し、`location.href = '/'` でオンボーディングからやり直します。

## 14. スタイリングとレスポンシブ・ダークモード

`src/index.css` 1 ファイル。

### デザイントークン

```css
:root {
  --bg / --surface / --text / --muted / --line   基本色
  --accent: #e0455a                              ブランド色（本音の赤）
  --shadow / --radius / --font
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { :root { …暗色に上書き… } }
```

デッキごとの色は React 側で `style={{ '--deck': deck.color }}` を流し込み、カードの波形・バッジ・ボタン・スライダーの `accent-color` などが自動で追従します。

### レイアウト

- `.shell` … 最大幅 480px の中央寄せ。`padding-top/bottom` に `env(safe-area-inset-*)` を使い、ノッチ・ホームバーを避ける。
- `.stage` / `.cardarea` … flex で残り高さいっぱいにカードを広げ、`min-height: 400px` で 667px 級の端末でもボタンが切れない。
- 下部ナビ `.bottomnav` は `position: sticky; bottom: 0`。

### スマホ向けの細かい配慮

| 項目 | 対応 |
|---|---|
| iOS の入力フォーカス時ズーム | 入力は 16px（本文サイズ）を継承。13px 以下の入力を作らない |
| タップ時の灰色フラッシュ | `-webkit-tap-highlight-color: transparent` |
| 横スクロールの発生 | `body { overflow-x: hidden }`、カードは `touch-action: pan-y` |
| 引っ張って更新の誤発火 | `overscroll-behavior-y: none` |
| ボタンの押しやすさ | 主要ボタンは高さ 48px 以上、チップは 36px 以上 |
| 長い質問文 | `.q` は 21px / line-height 1.5、本文はスクロール可（スクロール影付き） |

### 確認済みの表示環境

375×812（iPhone 12 系）、375×667（iPhone SE 系）、ライト／ダーク両方。

## 15. PWA（オフライン・ホーム画面追加）

`vite.config.ts` の `VitePWA` で設定。

- **manifest**: 名前「本音 - 質問カード」、`display: standalone`（ホーム画面から開くとブラウザ UI なし）、テーマ色、アイコン 3 種（SVG / 192 / 512）。
- **Service Worker**: Workbox の precache。ビルド成果物（HTML / JS / CSS / アイコン）をすべてキャッシュするため、一度開けば圏外でも起動・全機能が使えます。
- **更新方式**: `registerType: 'autoUpdate'`。新しいバージョンをデプロイすると、次回起動時にバックグラウンドで取得し、**その次の起動**で反映されます（1 回目は旧版のまま動く）。

## 17. テストと検証の記録

このプロジェクトは自動テストフレームワークを導入せず、**(a) 静的検査、(b) ロジックのスクリプト検証、(c) ブラウザでの E2E 操作** の 3 層で品質を確認しています。

### (a) 静的検査（クリーン環境で実施）

`node_modules` を削除 → `npm ci` → `validate` / `tsc -b` / `oxlint` / `vite build` をすべて実行し、**エラー 0・警告 0・ビルド成功**を確認。

### (b) ロジック検証（19 ケース・全 PASS）

`src/session/build.ts` と `people.ts` を `tsc` で単体コンパイルし、Node.js で以下を検証しました。

| 対象 | ケース |
|---|---|
| `buildQueue` | 指定枚数どおり／16+ 除外／段階モードでレベルが非減少／ID 重複なし／**未出題を優先**／無制限は全枚数／テーマ+レベル+16+ の複合フィルタ／枚数が母集団を超えたら丸める／レベル未選択は 0 枚 |
| `countAvailable` | `buildQueue` の母集団と一致 |
| `participants` | 恋人の既定ラベル／友達の空欄フォールバック／1 人だけのフォールバック／**同名を一意化** |
| `assignTurns` | 枚数一致／直前と同じ人を避ける／second ≠ first／全員が実在の名前／恋人は厳密に交互 |

「未出題を優先」は最初 FAIL となり、第 9 章のアルゴリズム修正につながりました。

## 18. 設計上の判断とトレードオフ

| 判断 | 採った側 | 捨てた側と理由 |
|---|---|---|
| バックエンドなし | localStorage のみ | 端末間同期・ペア共有はできないが、運用コスト 0・プライバシー説明が容易 |
| HashRouter | `/#/home` 形式 | URL は少し不格好だが、どの静的ホスティングでも設定不要 |
| 質問データを JS に同梱 | オフライン即動作 | バンドルが 577KB に。gzip 後 176KB なので許容。将来はデッキ単位の遅延読込も可能 |
| 自動テストフレームワーク未導入 | スクリプト検証 + 手動 E2E | 規模（約 1,600 行）に対して十分。Vitest 導入時は `session/*.ts` がそのままテスト対象になる |
| プレーン CSS | 依存ゼロ・750 行 | ユーティリティ CSS の速さは失うが、デザイン変数 + 少数のクラスで足りる |
| ウィジェット state をカード内に閉じる | `key` で自動破棄 | 「前のカードに戻って編集」はできない（仕様として不要） |
| 指名を開始時に一括決定 | 再描画で変わらない | 途中で参加者を増やせない（設定で変更後、次のセッションから反映） |

## 19. 既知の制約と注意点

- **データは端末・ブラウザ単位**。別の端末や、同じ端末でも別ブラウザ／シークレットモードでは共有されません。ブラウザのサイトデータ削除で消えます。
- **PWA 更新は 2 回目の起動で反映**（第 15 章）。
- **カード内の入力はスマホのキーボードで行う**ため、大人数の「せーの」入力は時間がかかります。大人数では「指さし」形式の方が向いています。
- **既出の記録はカード ID 単位**。質問文を書き換えても ID が同じなら既出扱いのままです。内容を大きく変えるときは新しい ID を振ってください。
- **友達モードの質問文に含まれる「相手」**は、指名された人に対して「隣の人」「みんな」と読み替えて運用する前提です。
- **バンドルサイズ警告**（Vite の 500KB しきい値）は出ますが動作に影響はありません。

# 第 II 部: コードで読む本音 — TypeScript と内部構造の詳解

ここからは「実際のコードがどう書かれているか」を、TypeScript の機能と React の仕組みに沿って解説します。第 I 部が地図なら、第 II 部は道案内です。引用しているコードはすべて現行のソースそのままです。

## 21. TypeScript の設定（tsconfig）を読む

プロジェクトには 3 つの tsconfig があります。

```
tsconfig.json          … 親。"references" で下の 2 つを束ねるだけ（files: []）
├─ tsconfig.app.json   … src/ 配下（ブラウザで動くコード）
└─ tsconfig.node.json  … vite.config.ts（Node.js で動くコード）
```

`npm run build` の先頭 `tsc -b` は「参照されている全プロジェクトを型チェックする」コマンドです。`noEmit: true` なので JS は出力せず、**型チェック専用**として使い、JS への変換は Vite（内部の Rolldown / OXC）に任せています。

### tsconfig.app.json の主要オプション

| オプション | 値 | 意味・効果 |
|---|---|---|
| `target` | `es2023` | 出力想定の JS バージョン。`Array.prototype.at()` などを型として使える |
| `lib` | `["ES2023", "DOM"]` | ブラウザ API（`document`, `localStorage` など）の型を有効化 |
| `module` / `moduleResolution` | `esnext` / `bundler` | ESM 前提。`import x from './a'` のように拡張子なしで解決できる（バンドラ流儀） |
| `types` | `["vite/client"]` | `import.meta.glob` や `import.meta.env`、`*.json` `*.svg` の import に型を与える |
| `jsx` | `react-jsx` | `import React` なしで JSX を書ける（React 17+ の自動ランタイム） |
| `verbatimModuleSyntax` | `true` | **型だけの import は `import type` と明示する**必要がある。バンドラが型 import を安全に消せる |
| `allowImportingTsExtensions` | `true` | `import App from './App.tsx'` のように `.tsx` 付きで書ける（`main.tsx` で使用） |
| `erasableSyntaxOnly` | `true` | `enum` やパラメータプロパティなど「消すだけでは JS にならない構文」を禁止。Node の型ストリップ実行と互換 |
| `noUnusedLocals` / `noUnusedParameters` | `true` | 未使用の変数・引数をエラーに |
| `noFallthroughCasesInSwitch` | `true` | `switch` の `break` 忘れをエラーに |
| `moduleDetection` | `force` | すべてのファイルをモジュール扱い（グローバル汚染防止） |
| `skipLibCheck` | `true` | `node_modules` 内の `.d.ts` は検査しない（ビルド高速化） |

`verbatimModuleSyntax` の影響はコード上に現れています。例えば:

```ts
import { QuestionCard, type QuestionCardHandle } from '../components/QuestionCard'
import type { AnswerRecord, SessionConfig } from '../types'
```

`QuestionCardHandle` と `types.ts` の中身はすべて型なので、`type` 修飾子を付けています。付け忘れると `tsc` がエラーを出すため、「実行時に存在しないものを import している」事故が起きません。

### Lint（.oxlintrc.json）

```json
{ "plugins": ["react", "typescript", "oxc"],
  "rules": { "react/rules-of-hooks": "error",
             "react/only-export-components": ["warn", { "allowConstantExport": true }] } }
```

- `rules-of-hooks` … フックを条件分岐の中で呼ぶなどの違反をエラーに。
- `exhaustive-deps` … `useEffect` / `useMemo` の依存配列の漏れを警告（プラグイン既定で有効）。意図的に依存を絞っている箇所には `// eslint-disable-next-line react-hooks/exhaustive-deps` を付け、理由が分かるようにしています。

## 22. 型システムの使い方 — `types.ts` を軸に

`src/types.ts` は 68 行ですが、アプリ全体の「語彙」を決めています。使われている TypeScript の機能を順に見ます。

### 22.1 文字列リテラルの Union 型（列挙の代わり）

```ts
export type Mode = 'couple' | 'friends'
export type Level = 1 | 2 | 3 | 4
export type CardType = 'open' | 'choice' | 'guess' | 'reveal' | 'scale' | 'thanks' | 'wish' | 'action'
```

`enum` ではなく Union を使う理由:

- JSON にそのまま書ける（`"type": "choice"`）。
- `switch (card.type)` で分岐すると、**分岐漏れが型エラーになる**（網羅性チェック）。
- `erasableSyntaxOnly` のもとでは `enum` は使えない。

`Level` を `number` ではなく `1 | 2 | 3 | 4` にしているので、`LEVEL_LABEL[5]` のような値はそもそも作れません。

### 22.2 `interface` によるデータ形の宣言

```ts
export interface Card {
  id: string
  type: CardType
  level: Level
  themes: string[]
  text: LText
  options?: LText[]   // ? = 省略可能
  seconds?: number
  rating?: 'all' | '16+'
}
```

`?` が付いたプロパティは「無いかもしれない」ので、使う側は `card.options ?? []` や `card.seconds ?? 0` のように**必ず既定値を与える**書き方になります。これは意図的な設計で、「choice 以外のカードに options は無い」という現実を型が表現しています。

### 22.3 `type` と `interface` の使い分け

- **`type`** … Union（`Mode`, `Level`）や関数型など「合成」に使う。
- **`interface`** … オブジェクトの形（`Card`, `Deck`, `SessionConfig`）に使う。

プロジェクト内ではこの慣習で統一しています。

### 22.4 タプル型

```ts
names: [string, string]   // 恋人モードの 2 人の名前。長さ 2 固定
```

`string[]` ではなくタプルにすることで、`names[2]` へのアクセスが型エラーになり、「恋人は必ず 2 人」がコードで保証されます。友達は人数可変なので `friends: string[]` です。

### 22.5 `Partial<T>` と `Pick<T, K>`（ユーティリティ型）

```ts
setProfile: (p: Partial<Profile>) => void          // 一部のフィールドだけ更新できる
updateSession: (id: string, patch: Partial<SessionRecord>) => void
function RevealInputs({ people, onValues }: Pick<WidgetProps, 'people' | 'onValues'>)
```

`Partial` は「全部省略可能にした型」、`Pick` は「必要なキーだけ抜き出した型」。既存の型から派生させるので、`Profile` にフィールドを足しても `setProfile` の型は自動で追随します。

### 22.6 ジェネリクス

```ts
function shuffle<T>(arr: T[]): T[]                       // 何の配列でもシャッフルできる
const toggle = <T,>(list: T[], v: T) => ...              // TSX 内では <T,> と書く（JSX と区別するため）
const modules = import.meta.glob<Deck>('./decks/*/*.json', { eager: true, import: 'default' })
```

3 つ目は Vite の API に「読み込んだ JSON は `Deck` 型だ」と教えており、以降 `DECKS` は `Deck[]` として扱えます。

### 22.7 `as` によるキャストを使う場所（意図的に限定）

```ts
const cfg = useLocation().state as SessionConfig | null           // ルーターの state は unknown
style={{ ['--deck' as string]: deck.color }}                      // CSS 変数名は React の型にない
const levelsInDeck = [...new Set(deck.cards.map((c) => c.level))].sort() as Level[]
```

いずれも「TypeScript が知りようのない外部境界」でだけ `as` を使い、内部ロジックではキャストしません。ルーターから来た `cfg` が `null` の可能性は型に含めてあるので、直後に `if (!deck || !cfg) return <Navigate … />` というガードが必須になります。

### 22.8 `forwardRef` と `useImperativeHandle` の型

親（Session）が子（QuestionCard）の関数を呼ぶ「命令的 API」を、型安全に公開しています。

```ts
export interface QuestionCardHandle { swipe: (dir: 'next' | 'pass') => void }

export const QuestionCard = forwardRef<QuestionCardHandle, Props>(function QuestionCard(p, ref) {
  ...
  useImperativeHandle(ref, () => ({ swipe }))
})

// 親側
const cardRef = useRef<QuestionCardHandle>(null)
<QuestionCard ref={cardRef} ... />
<button onClick={() => cardRef.current?.swipe('next')}>次のカード</button>
```

`forwardRef<Handle, Props>` の 2 つの型引数で「ref から何が取れるか」「props は何か」を両方固定。`cardRef.current?.swipe` の `?.` は「まだマウントされていない（null）」を型が強制する安全策です。

### 22.9 `Record<K, V>` と `Map`

```ts
export const THEMES: Record<string, LText> = { values: {...}, love: {...}, ... }
seen: Record<string, string[]>                       // deckId → cardIds
const byLevel = new Map<Level, Card[]>()             // ロジック内の一時集計
```

JSON にも保存するデータは `Record`（＝ただのオブジェクト）、計算中だけ使うものは `Map`。永続化との相性で使い分けています。

## 23. モジュール依存グラフ

`import` の向きを図にしたものです。矢印は「左が右を使う」。**循環はありません**。

```
main.tsx ─▶ App.tsx ─▶ pages/* ─┬─▶ components/QuestionCard ─▶ components/Widgets
                                 │        │                          │
                                 │        └─▶ content/themes         └─▶ types
                                 ├─▶ components/FriendsEditor
                                 ├─▶ session/build ─▶ types
                                 ├─▶ session/people ─▶ types
                                 ├─▶ content/index ─▶ decks/*.json, types
                                 ├─▶ content/themes ─▶ types
                                 └─▶ store ─▶ types
```

ルール:

- `types.ts` は誰にも依存しない（最下層）。
- `session/*` と `content/*` は React を import しない（純 TS）。
- `store.ts` は zustand と types だけ。UI を知らない。
- `pages/*` だけがルーターとストアとロジックを**組み合わせる**層。

このため、ロジックの変更が UI に波及する範囲は「そのロジックを呼んでいる page」に限定されます。

## 24. 起動シーケンス（ブラウザで開いてから最初の画面まで）

```
1. index.html が読まれる
   └─ <div id="root"> と <script type="module" src="/src/main.tsx">（本番では /assets/index-xxxx.js）
2. main.tsx
   ├─ import './index.css'        … CSS がバンドルに含まれ <style> として注入
   ├─ import App from './App.tsx'
   └─ createRoot(root).render(<StrictMode><App/></StrictMode>)
3. App.tsx
   └─ <HashRouter> が location.hash を読み、<Routes> が一致する要素を選ぶ
4. 各 page が useStore(...) を呼ぶ
   └─ zustand の persist が localStorage["honne-v1"] を読み、merge で初期値と合成（同期的）
5. content/index.ts がモジュール評価時に DECKS を組み立てる（JSON は JS に同梱済み・非同期なし）
6. 初回描画
7. registerSW.js（別スクリプト）が Service Worker を登録 → 以降オフライン可
```

**非同期の読み込みが一切ない**のがポイントです。ローディング画面が不要で、最初のフレームで完全な UI が出ます。

## 25. コンポーネントツリーと props の流れ

セッション画面を例に、誰が何を持ち、何を渡すかを示します。

```
<Session>                                  … 状態の持ち主
 │  state: idx, draft            ref: stats, sessionId, cardRef, finished
 │  memo : queue, people, turns
 │
 ├─ <p class="turn">{turnLine}</p>          … turns[idx] から計算
 │
 ├─ <QuestionCard key={next.id} back … />   … 背面。すべてのコールバックは no-op
 │
 └─ <QuestionCard key={card.id} ref={cardRef}
 │      card deck people turn showEnglish
 │      favorite        onToggleFavorite   ← store.toggleFavorite
 │      onSwipe={advance}                  ← 進行の本体
 │      onValues onResult                  → setDraft(...)
 │      memo onMemo                        → setDraft(...) />
 │     │
 │     ├─ <motion.div drag="x">            … x, rotate は MotionValue（React state ではない）
 │     └─ <div class="interact" onPointerDownCapture=stop>
 │           ├─ {widget}                   … card.type で ChoiceWidget / RevealWidget / … を選択
 │           │     └─ 自前の useState（picks / vals / r / left）→ 変化時に onValues / onResult
 │           └─ <MemoWidget value={memo} onChange={onMemo}/>
 │
 └─ <div class="actions">
       <button onClick={() => cardRef.current?.swipe('pass')}>パス</button>
       <button onClick={() => cardRef.current?.swipe('next')}>次のカード</button>
```

### データの流れは一方向

```
ユーザー操作（タップ / ドラッグ）
   → ウィジェットのローカル state 更新
   → onValues / onResult / onMemo で Session の draft へ
   → スワイプ確定（advance）で store へ保存（saveAnswer / markSeen）
   → store → localStorage（persist）
   → 次回 Library / Summary が store を購読して表示
```

「上から下へ props、下から上へコールバック」という React の基本に忠実で、コンテキストやイベントバスは使っていません。

### なぜ背面カードにも同じコンポーネントを使うのか

見た目を一致させるためと、**背面 → 前面の昇格をアニメーションで繋ぐ**ためです。`key={card.id}` が同じなら React は同じ DOM を再利用し、`animate={p.back ? {scale:.95,y:12} : {scale:1,y:0}}` の変化が framer-motion によって補間されます。

## 26. React フックの使い分け（Session.tsx を教材に）

| フック | 使用箇所 | 使う理由 |
|---|---|---|
| `useState` | `idx`, `draft` | 変わったら**再描画が必要**な値 |
| `useRef` | `stats`, `sessionId`, `seenAtStart`, `finished`, `cardRef` | 変わっても再描画**不要**、または「初回の値を固定」したい |
| `useMemo` | `queue`, `people`, `turns` | 計算が重い／**同一参照を保ちたい**（乱数を含むので再計算されると出題が変わってしまう） |
| `useEffect` | セッション登録と離脱時のクリーンアップ | 副作用（store への書き込み）は描画とは別のタイミングで |
| `useImperativeHandle` | QuestionCard | 子の関数を親から呼ぶ |
| `useMotionValue` / `useTransform` | QuestionCard | 60fps で変わる値を React の再描画を通さずに DOM へ |

### `useMemo` の依存配列を `[deck?.id]` に絞っている理由

```ts
const queue = useMemo(
  () => (deck && cfg ? buildQueue(deck, cfg, seenAtStart.current, profile.adult) : []),
  // eslint-disable-next-line react-hooks/exhaustive-deps
  [deck?.id],
)
```

`buildQueue` はシャッフルを含むため、依存に `cfg` や `profile` を入れると「設定画面で英語表示を切り替えただけで出題順が変わる」事故が起きます。**「セッション中は固定」**が仕様なので、意図的に依存を `deck?.id` だけにし、Lint の警告を明示的に無効化しています。

### `useRef(useStore.getState().seen[...])` というイディオム

```ts
const seenAtStart = useRef(useStore.getState().seen[cfg?.deckId ?? ''] ?? [])
```

`useStore(selector)` で購読すると `seen` が増えるたびに再描画されますが、ここでは「開始時点のスナップショット」が欲しいだけ。`getState()` で購読せずに読み、`useRef` の初期値に入れることで、以降は変わりません。

### クリーンアップで最新値を読むための関数化

```ts
const closeIfAbandoned = () => {
  if (finished.current) return
  updateSession(sessionId.current, { endedAt: new Date().toISOString(), ...stats.current })
}
useEffect(() => {
  startSession({...})
  return () => closeIfAbandoned()   // アンマウント時に呼ばれる
}, [])
```

クリーンアップ関数はマウント時に作られるので、そこで直接 `stats.current` を読むと Lint が「古い値かも」と警告します。`useRef` の値は常に最新なので実害はありませんが、関数に切り出して呼ぶ形にして意図を明確にしています。

---

## 27. `advance` — 1 枚進める処理の逐行解説

Session の中核。スワイプ確定時に呼ばれます。

```ts
const advance = (dir: 'next' | 'pass') => {
  if (!card) return                                   // 念のため（キューが空のとき）
  markSeen(deck.id, card.id)                          // ① 既出に記録（パスでも）
  if (dir === 'next') {
    stats.current.answered++                          // ② 集計（useRef なので再描画なし）
    if (draft.result === 'hit') stats.current.hits++
    if (draft.result === 'miss') stats.current.misses++
    if (draft.memo || draft.values?.some(Boolean) || draft.result) {   // ③ 何か入力があれば保存
      const rec: AnswerRecord = {
        cardId: card.id,
        deckId: deck.id,
        at: new Date().toISOString(),
        memo: draft.memo || undefined,                                  // 空文字は保存しない
        values: draft.values?.map((v, i) => (v && people[i] ? `${people[i]}: ${v}` : v)),  // 名前付き
        result: draft.result,
      }
      saveAnswer(rec)
    }
  } else {
    stats.current.passed++
  }
  setDraft({ memo: '' })                              // ④ 次のカード用に下書きを空に
  if (idx + 1 >= queue.length) finish()               // ⑤ 最後なら終了、そうでなければ次へ
  else setIdx(idx + 1)
}
```

型の観点で注目すべき点:

- `rec: AnswerRecord` と**明示的に注釈**しているので、フィールドの打ち間違いや型違いはこの行で検出されます。
- `draft.values?.map(...)` の `?.` は `values` が `undefined`（open カードなど）の場合に `undefined` のまま通します。
- `memo: draft.memo || undefined` は「空文字を `undefined` に正規化」して、Library で `a.memo && …` の判定を単純にしています。

## 28. `buildQueue` の型と不変条件

```ts
export function buildQueue(deck: Deck, cfg: SessionConfig, seen: string[], adult: boolean): Card[]
```

この関数が守る**不変条件**（テストで検証済み）:

1. 返り値は `pool`（条件を満たすカード）の部分集合で、ID に重複がない。
2. 長さは `min(target, pool.length)`。
3. `adult === false` なら `rating === '16+'` を含まない。
4. `gradient === true` なら `level` は非減少。
5. 未出題が `target` 枚以上あれば既出を含まない。

純関数（引数だけで結果が決まる・外部を書き換えない）にしてあるので、React も DOM も不要でテストでき、乱数の影響は「順序」だけに限定されています。

`shuffle<T>` は Fisher–Yates で、`arr.slice()` してから並べ替えるため**入力配列を破壊しません**。`deck.cards` はモジュールスコープの共有データなので、これを壊すと次のセッションに影響します。

## 29. ストアの型設計（store.ts）

```ts
interface State {
  profile: Profile
  seen: Record<string, string[]>
  favorites: string[]
  answers: AnswerRecord[]
  sessions: SessionRecord[]
  setProfile: (p: Partial<Profile>) => void
  markSeen: (deckId: string, cardId: string) => void
  ...
}
export const useStore = create<State>()(persist((set) => ({ ...initial, /* actions */ }), { name: 'honne-v1', merge }))
```

### 状態と操作を同じ型に入れる理由

zustand の流儀で、`useStore((s) => s.toggleFavorite)` のように**操作も購読できる**ため。操作関数は生成時に一度作られ参照が変わらないので、購読しても再描画は起きません。

### 不変更新（イミュータブル更新）

```ts
markSeen: (deckId, cardId) =>
  set((s) => {
    const list = s.seen[deckId] ?? []
    if (list.includes(cardId)) return s              // 変更なし → 同じ state を返して再描画を防ぐ
    return { seen: { ...s.seen, [deckId]: [...list, cardId] } }   // 新しいオブジェクトを作る
  }),
```

配列やオブジェクトを**直接書き換えず**、スプレッドで新しいものを作ります。React/zustand は参照の変化で更新を検知するため、これが崩れると画面が更新されません。

### `persist` の `merge`

```ts
merge: (persisted, current) => {
  const p = (persisted ?? {}) as Partial<State>
  return { ...current, ...p, profile: { ...current.profile, ...(p.profile ?? {}) } }
}
```

既定のマージは浅い（`profile` ごと上書き）ため、古い保存データに `friends` が無いと `profile.friends` が `undefined` になり、`friends.map` で落ちます。`profile` だけ 1 段深くマージすることで、**フィールドを追加しても過去のユーザーが壊れない**ようにしています。今後 `profile` に項目を足すときも同じ経路で安全です。

## 30. ビルドパイプラインの内側

```
npm run build
 ├─ tsc -b
 │    └─ tsconfig.app.json / tsconfig.node.json を型チェック（出力なし）。エラーがあればここで停止
 └─ vite build
      ├─ index.html を起点に import グラフを辿る
      ├─ .tsx → JS（OXC が型を剥がして JSX を変換。tsc は使わない）
      ├─ .json → JS モジュール（import.meta.glob の eager で静的 import に展開）
      ├─ .css → 1 ファイルに結合・最小化、index.html に <link>
      ├─ Rolldown が 1 チャンクに束ねて最小化 → dist/assets/index-<hash>.js
      ├─ vite-plugin-pwa
      │    ├─ manifest.webmanifest を生成し index.html に <link rel="manifest">
      │    ├─ registerSW.js を生成（SW 登録の小さなスクリプト）
      │    └─ Workbox が dist/ の全ファイル一覧（precache manifest）を含む sw.js を生成
      └─ dist/ 完成（index.html, assets/, icons/, manifest, sw.js, workbox-*.js）
```

ファイル名の `<hash>` は内容から決まるため、変更のないファイルはブラウザキャッシュがそのまま効き、変更があれば確実に新しい名前になります（キャッシュバスティング）。

### 開発時（`npm run dev`）との違い

開発サーバーはバンドルせず、ブラウザが `.tsx` を 1 ファイルずつ ESM として読み、変更したファイルだけ差し替えます（HMR）。React Fast Refresh により、ウィジェットを編集しても state を保ったまま画面が更新されます。`only-export-components` の Lint 警告は「コンポーネント以外を export すると Fast Refresh が効かない」という開発体験のための注意です。

## 31. 実行時のイベントフロー（例: どっち派？カードで 4 人が答える）

```
[タップ: 参加者チップ「みお」]
  ChoiceWidget.setWho(1)                         → 再描画（チップの on 状態）
[タップ: 選択肢「メッセージ」]
  pick(1)
   ├─ picks = [null, 1, null, null] を setPicks   → 再描画（選択肢に「みお」タグ）
   ├─ onValues(['', 'メッセージ', '', ''])        → Session.setDraft({...d, values})
   └─ 次の未回答者へ setWho(0)
[…全員分…]
  done === true → verdict() → 「多数派は「直接」(3人)。少数派の みお に理由を聞こう」
[右にスワイプ]
  onDragEnd → offset.x > 110 → swipe('next')
   ├─ setLeaving(true)、animate(x → 600)
   └─ 230ms 後 p.onSwipe('next') === advance('next')
        ├─ markSeen, stats.answered++
        ├─ saveAnswer({ values: ['とも: 直接', 'みお: メッセージ', ...] }) → localStorage
        ├─ setDraft({memo:''}), setIdx(idx+1)
        └─ 再描画: 背面カードが前面へ、新しい背面がマウント、古い前面はアンマウント（ウィジェット state も破棄）
```

## 33. 用語集

| 用語 | 意味 |
|---|---|
| デッキ | テーマごとの質問の束（例: 飲み会で）。1 JSON ファイル |
| カード | 1 問。8 つの形式のいずれか |
| レベル／深さ | Lv.1 ライト〜Lv.4 本音。質問の踏み込み度 |
| 段階モード（gradient） | セッション内でレベル昇順に並べる出題方式 |
| 既出（seen） | 一度画面に出したカード。次回以降は後回し |
| セッション | 「はじめる」から「終了」まで。履歴 1 件に対応 |
| 指名（turn） | そのカードで最初に答える人／相手 |
| ウィジェット | 形式ごとの操作 UI（選択肢・スライダーなど） |
| SPA | 1 枚の HTML で画面を切り替える Web アプリ |
| PWA | ホーム画面に追加でき、オフラインでも動く Web アプリ |
| Service Worker | ブラウザ内でファイルをキャッシュし、オフライン起動を可能にする仕組み |
| zustand | 軽量な状態管理ライブラリ |
| framer-motion | React 向けアニメーション／ジェスチャーライブラリ |

(function(){
  var md = document.getElementById('src').textContent;

  var toc = document.getElementById('toc'), mtoc = document.getElementById('mtoc');

  var links = [];
  main.querySelectorAll('h1, h2').forEach(function(h, i){

    if (h.tagName === 'H1') {
      h.id = 'part-2';
      var p = document.createElement('div'); p.className='part'; p.textContent='第 II 部 · コードで読む'; toc.appendChild(p);

    var m = text.match(/^(\d+)\.\s*(.*)$/);
    var num = m ? m[1] : '', label = m ? m[2] : text;
    h.id = 'c' + (num || i);
    var inner = h.innerHTML.replace(/^\s*\d+\.\s*/, '');
    h.innerHTML = '<span class="num">CHAPTER ' + num + '</span>' + inner;
    var short = label.replace(/\s*[—―(（].*$/, '').trim();
    var a = document.createElement('a'); a.href = '#' + h.id;
    a.innerHTML = '<span class="n">' + num + '</span><span></span>';
    a.lastChild.textContent = short;
    toc.appendChild(a); mtoc.appendChild(a.cloneNode(true));
    links.push({ a: a, h: h });
  });

    var io = new IntersectionObserver(function(entries){

        links.forEach(function(l){ l.a.classList.toggle('active', l.h === e.target); });
      }});
    }, { rootMargin: '-10% 0px -80% 0px' });
    links.forEach(function(l){ io.observe(l.h); });
  }
})();
